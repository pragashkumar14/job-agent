# Hard rules the agent must respect when scoring and drafting.
# Hard gates. A posting that requires any of these is NOT a match, however
# well the rest of it fits. French postings mark them with "exigé",
# "impératif", "indispensable", "critère éliminatoire", "obligatoire".
hard_limits:
  languages_spoken: ["French", "English", "Tamil", "Sinhala"]
  # Any OTHER language required at courant/bilingue level is an automatic skip.
  # German, Spanish, Italian, Dutch, Mandarin etc. are NOT spoken.
  certifications_held: []
  # No professional certification is held yet. A posting that REQUIRES a
  # named certification (AWS, Azure, GCP, ITIL, PMP, CISSP, Prince2, SAP
  # module certs, customs/déclarant certification) is an automatic skip.
  # "souhaité", "apprécié", "un plus" is fine — that is a preference.
  no_deep_expertise_in:
    - "CREDOC / crédits documentaires (exposure only, not expertise)"
    - "SAP or Infor M3 as a named, mastered ERP"
    - "Salesforce specifically (other CRMs yes)"
  no_formal_degree_above: "Bac+2 equivalent (two London diplomas)"
  # A posting demanding Bac+5 / ingénieur / master as a stated requirement
  # is an automatic skip.

constraints:
  never_claim:
    - "AWS Certified Cloud Practitioner as held"
    - "Google Cloud Digital Leader as held"
    - "Any skill that cannot be credibly defended in an interview"
  never_call_training: "bootcamp"
  reply_language: "en"      # Claude talks to Pragash in English
  default_draft_language: "fr"  # deliverables default to French
